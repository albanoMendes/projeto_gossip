[project]
name = "mural-gossip"
version = "0.1.0"
description = "Replicated bulletin board using push-pull gossip (anti-entropy) over UDP"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["testes"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.setuptools]
packages = ["src"]
